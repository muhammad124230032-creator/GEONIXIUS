name: Build EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requirements
        run: pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller --onefile --windowed geonixius.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GEONIXIUS-EXE
          path: dist/geonixius.exe
